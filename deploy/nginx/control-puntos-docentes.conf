# Plantilla: reemplazar el dominio y las rutas de certificados según la
# infraestructura UNRC antes de habilitarla.
server {
    listen 80;
    server_name puntos-docentes.unrc.edu.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name puntos-docentes.unrc.edu.ar;

    ssl_certificate     /etc/ssl/certs/puntos-docentes.crt;
    ssl_certificate_key /etc/ssl/private/puntos-docentes.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe el encabezado recibido para impedir que el cliente
        # falsifique la IP usada en límites de acceso y auditoría.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Server;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
